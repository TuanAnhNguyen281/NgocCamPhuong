<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Ngọc Cẩm Phường</title>
    <style>
      /* Man hinh cho hien truoc khi React mount; bi thay the khi app render. */
      .app-splash { display: grid; min-height: 100vh; place-content: center; justify-items: center; gap: 18px; background: #f4f0e8; color: #151918; font-family: Georgia, "Times New Roman", serif; }
      .app-splash strong { font-size: 26px; font-weight: 500; letter-spacing: .01em; animation: splash-in .6s ease both; }
      .app-splash span { position: relative; display: block; width: 120px; height: 1px; overflow: hidden; background: #c9c6bd; }
      .app-splash span::after { position: absolute; inset: 0; background: #315f73; content: ""; animation: splash-line 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-line { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-splash" role="status" aria-label="Đang mở cửa hàng"><strong>Ngọc Cẩm Phường</strong><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
